appId: com.leetcodedojo.app
productName: LeetCode Dojo
copyright: ParaPsychic

directories:
  output: dist-electron
  buildResources: build

# App icon: build/icon.png (square PNG derived from public/dojo.png) is
# auto-detected from buildResources and referenced explicitly per platform
# below. electron-builder generates the Windows .ico, macOS .icns, and the
# Linux icon set from it.

# Only the Electron shell goes into the asar. The actual Next app (server +
# its traced node_modules) ships as extraResources and runs as a child process,
# so we exclude node_modules from the asar to keep it small.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  - from: .next/standalone
    to: app
  - from: .next/static
    to: app/.next/static
  - from: public
    to: app/public

asar: true

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.developer-tools

# Native packages (deb/rpm/pacman) are preferred on Linux: the AppImage's
# bundled runtime can't reach the natively installed Claude Code, so the app
# shows an in-app warning when it detects it's running from an AppImage.
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Development
  synopsis: Socratic DSA interview trainer
  artifactName: ${name}-${version}.${ext}

# ubuntu-latest is now Ubuntu 24.04 (rpm 4.18). Its rpmbuild generates
# /usr/lib/.build-id/ symlinks from ELF build-ids, which trips on Electron's
# bundled prebuilt shared libraries and fails `rpmbuild -bb` with a bare exit 1
# (fpm swallows the stderr). Since the app ships self-contained and already
# stripped, disable the build-id link step. rpm is built before pacman, so this
# failure was also blocking the .pacman target.
#
# `--log debug` is diagnostic: fpm relays rpmbuild's own stdout/stderr only at
# its debug level, so without it CI shows the failing rpmbuild command but not
# a single line of why it failed. Drop it once the rpm target is green again.
rpm:
  fpm:
    - "--rpm-rpmbuild-define"
    - "_build_id_links none"
    - "--log"
    - "debug"

# electron-builder's built-in pacman depends list is unmaintained and names two
# packages Arch no longer ships — `http-parser` (dropped, superseded by llhttp)
# and `libappindicator-gtk3` (moved out of the repos long ago) — so `pacman -U`
# aborts with "target not found" before it installs anything. The rest of that
# list (c-ares, ffmpeg, libvpx, minizip, re2, snappy, libevent, libxslt) is
# wrong in a subtler way: those are the deps of Arch's *own* electron package,
# which is linked against system libraries. Our Electron is the upstream
# prebuilt binary and bundles them, so the only real requirements are the
# system libraries it actually dlopens/links. Every name below was checked
# against the current Arch repos.
pacman:
  depends:
    - gtk3
    - nss
    - nspr
    - at-spi2-core
    - libcups
    - libdrm
    - mesa
    - alsa-lib
    - libxkbcommon
    - libxcomposite
    - libxdamage
    - libxrandr
    - libxtst
    - libnotify
    - libsecret
    - xdg-utils
