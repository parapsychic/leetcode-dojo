appId: com.leetcodedojo.app
productName: LeetCode Dojo
copyright: ParaPsychic

directories:
  output: dist-electron
  buildResources: build

# App icon: build/icon.png (square PNG derived from public/dojo.png) is
# auto-detected from buildResources and referenced explicitly per platform
# below. electron-builder generates the Windows .ico, macOS .icns, and the
# Linux icon set from it.

# Only the Electron shell goes into the asar. The actual Next app (server +
# its traced node_modules) ships as extraResources and runs as a child process,
# so we exclude node_modules from the asar to keep it small.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

# The `.next/standalone/node_modules` mapping looks redundant next to the one
# above it, but it is what makes the packaged app runnable. electron-builder's
# copy filter (app-builder-lib/out/util/filter.js) hardcodes
#
#   if (relative === "node_modules") return false
#
# to keep a project's root node_modules out of the asar — and the same filter
# runs for extraResources. So `from: .next/standalone` silently drops the
# server's entire traced dependency tree, and the packaged app dies at startup
# with "Cannot find module 'next'". Copying that directory as its own mapping
# sidesteps the rule: relative to this `from`, nothing is named "node_modules".
extraResources:
  - from: .next/standalone
    to: app
  - from: .next/standalone/node_modules
    to: app/node_modules
  - from: .next/static
    to: app/.next/static
  - from: public
    to: app/public

asar: true

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# macos-latest runners are Apple Silicon, so the CI builds both slices
# explicitly (--x64 --arm64) — otherwise Intel Macs get no build at all — and
# artifactName has to carry ${arch} to keep the two dmgs apart.
#
# identity "-" is an ad-hoc signature. macOS refuses to launch an *unsigned*
# arm64 binary outright, and rebranding the app invalidates the signature
# Electron shipped with, so without this the arm64 dmg is dead on arrival.
# hardenedRuntime must be off to go with it: hardened runtime + ad-hoc means
# library validation rejects Electron's own frameworks at launch. This is not
# notarization — first launch still needs right-click → Open — but the app runs.
mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}

# Native packages (deb/rpm/pacman) are preferred on Linux: the AppImage's
# bundled runtime can't reach the natively installed Claude Code, so the app
# shows an in-app warning when it detects it's running from an AppImage.
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Development
  synopsis: Socratic DSA interview trainer
  artifactName: ${name}-${version}.${ext}

# ubuntu-latest is now Ubuntu 24.04 (rpm 4.18). Its rpmbuild generates
# /usr/lib/.build-id/ symlinks from ELF build-ids, which trips on Electron's
# bundled prebuilt shared libraries and fails `rpmbuild -bb` with a bare exit 1
# (fpm swallows the stderr). Since the app ships self-contained and already
# stripped, disable the build-id link step. rpm is built before pacman, so this
# failure was also blocking the .pacman target.
#
# Requires are given in rpm's rich "(a or b)" form wherever Fedora and openSUSE
# disagree on a name, which is what electron-builder's own defaults already do
# for libXtst/libuuid. The defaults predate Chromium needing gbm, drm, cups,
# alsa and xkbcommon directly, so those are added here. Every name was checked
# against current Fedora metadata.
rpm:
  depends:
    - "(gtk3 or libgtk-3-0)"
    - "(libnotify or libnotify4)"
    - "(nss or mozilla-nss)"
    - "(libXScrnSaver or libXss1)"
    - "(libXtst or libXtst6)"
    - "(at-spi2-core or libatspi0)"
    - "(libuuid or libuuid1)"
    - "(alsa-lib or libasound2)"
    - "(mesa-libgbm or libgbm1)"
    - "(libdrm or libdrm2)"
    - "(cups-libs or libcups2)"
    - "(libxkbcommon or libxkbcommon0)"
    - "(libsecret or libsecret-1-0)"
    - xdg-utils
  fpm:
    - "--rpm-rpmbuild-define"
    - "_build_id_links none"

# Same gap on the Debian side: the built-in list predates Chromium linking gbm,
# drm, cups and alsa directly. The classic (pre-t64) names are used deliberately
# — on 64-bit Debian/Ubuntu the t64 packages Provide them (verified:
# libasound2t64 provides libasound2, libcups2t64 provides libcups2, and so on),
# so one name resolves on both old and new releases.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    - libgbm1
    - libdrm2
    - libcups2

# electron-builder's built-in pacman depends list is unmaintained and names two
# packages Arch no longer ships — `http-parser` (dropped, superseded by llhttp)
# and `libappindicator-gtk3` (moved out of the repos long ago) — so `pacman -U`
# aborts with "target not found" before it installs anything. The rest of that
# list (c-ares, ffmpeg, libvpx, minizip, re2, snappy, libevent, libxslt) is
# wrong in a subtler way: those are the deps of Arch's *own* electron package,
# which is linked against system libraries. Our Electron is the upstream
# prebuilt binary and bundles them, so the only real requirements are the
# system libraries it actually dlopens/links. Every name below was checked
# against the current Arch repos.
pacman:
  depends:
    - gtk3
    - nss
    - nspr
    - at-spi2-core
    - libcups
    - libdrm
    - mesa
    - alsa-lib
    - libxkbcommon
    - libxcomposite
    - libxdamage
    - libxrandr
    - libxtst
    - libnotify
    - libsecret
    - xdg-utils
